name: project; resume challange

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      actions:
        description: 'terraform commands'
        required: true
        type: choice
        options:
          - Plan
          - Apply
          - Destroy
permissions: 
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: git clone the repository
        uses: actions/checkout@v6

      - name: setup python (same version as the lambda runtime)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/lambda/requirements-dev.txt

      - name: install test dependencies
        run: pip install -r modules/lambda/requirements-dev.txt

      - name: run lambda tests
        run: pytest modules/lambda/tests -v

  Terraform:
    needs: test
    runs-on: ubuntu-latest
    env:
      TF_VAR_bucket_main: ${{ vars.BUCKET_MAIN }}
      TF_VAR_lambda_execution_role_arn: ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
    steps:
      - name: git clone the repository 
        uses: actions/checkout@v6
      
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:    
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_OIDC_ROLE }}
          aws-region: eu-central-1


      - name: setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: terraform init with s3 backend
        run: terraform init -backend-config="bucket=${{ secrets.BUCKET_BACKEND }}"

      - name: terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.actions == 'Plan'
        run: terraform plan

      - name: terraform apply with auto approve
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.actions == 'Apply'
        run: terraform apply -auto-approve

      - name: terraform destroy with auto approve
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.actions == 'Destroy'
        run: terraform destroy  -auto-approve
        



  